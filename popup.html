<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a2e;
      background: #f8f9fa;
    }

    .header {
      padding: 16px;
      background: #1a1a2e;
      color: #fff;
      text-align: center;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .content {
      padding: 16px;
    }

    .count {
      text-align: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: #555;
    }

    .count strong {
      color: #e74c3c;
      font-size: 20px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .close-btn {
      background: #e74c3c;
      color: #fff;
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .close-btn:disabled {
      background: #ccc;
      cursor: default;
    }

    .shortcut {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: #eee;
      font-family: monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SearchBGon</h1>
  </div>
  <div class="content">
    <div class="count">
      <strong id="count">0</strong> search tab(s) open
    </div>
    <button class="close-btn" id="closeBtn" disabled>Close Search Tabs</button>
    <div class="shortcut">or press <kbd>Ctrl+Shift+Z</kbd></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
